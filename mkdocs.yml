site_name: CERTIF-CLOUD
site_url: https://certif-cloud.github.io/
site_description: Proyecto de innovación educativa de 2.º ASIR - IES Miguel Herrero Pereda
copyright: © 2026 IES Miguel Herrero Pereda · Proyecto CERTIF-CLOUD

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-blanco.png
  favicon: assets/favicon.png
  language: es
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

nav:
  - Inicio: index.md
  - Proyecto: proyecto.md
  - Escalas:
      - escalas/index.md
      - "Escala 1 · Fundamentos cloud": escalas/escala-1.md
      - "Escala 2 · Redes y conectividad": escalas/escala-2.md
  - Recursos: recursos.md
  - Guía docente: guia-docente.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
